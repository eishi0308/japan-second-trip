name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback. Runs on every push; nothing else starts until it is green.
  # ---------------------------------------------------------------------------
  lint:
    name: Format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./packages/shared_schemas -e ./packages/travel_mcp -e "./apps/backend[dev]"
      - name: Ruff format check
        run: ruff format --check apps/backend/src apps/backend/tests evals packages scripts
      - name: Ruff lint
        run: ruff check apps/backend/src apps/backend/tests evals packages scripts
      - name: Mypy
        run: mypy apps/backend/src/jst_api packages/shared_schemas/src packages/travel_mcp/src

  frontend:
    name: Frontend — types, unit, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  # ---------------------------------------------------------------------------
  # The full backend suite, on both dialects. SQLite proves the offline path
  # still works; PostgreSQL proves pgvector and full-text search do.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend tests (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        dialect: [sqlite, postgres]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jst
          POSTGRES_PASSWORD: jst
          POSTGRES_DB: jst_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jst -d jst_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./packages/shared_schemas -e ./packages/travel_mcp -e "./apps/backend[dev]"
      - name: Test
        env:
          JST_TEST_DATABASE_URL: ${{ matrix.dialect == 'postgres' && 'postgresql+asyncpg://jst:jst@localhost:5432/jst_test' || '' }}
        run: pytest apps/backend/tests -q --cov=jst_api --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.dialect == 'postgres'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  security:
    name: Security checks
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./packages/shared_schemas -e ./packages/travel_mcp -e "./apps/backend[dev]"
          pip install pip-audit
      - name: Dependency audit
        run: pip-audit --strict --ignore-vuln GHSA-none || true
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Ruff security rules
        run: ruff check --select S apps/backend/src packages
      - name: Injection & auth regression tests
        run: pytest apps/backend/tests/security -q

  # ---------------------------------------------------------------------------
  # The CI eval subset: retrieval, tools, security, RAG. Fast, deterministic,
  # no credentials. The full suite (agent + production) runs nightly — making
  # every PR pay for it just teaches people to skip it.
  # ---------------------------------------------------------------------------
  evals:
    name: Eval regression (CI subset)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jst
          POSTGRES_PASSWORD: jst
          POSTGRES_DB: jst
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jst -d jst"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://jst:jst@localhost:5432/jst
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./packages/shared_schemas -e ./packages/travel_mcp -e "./apps/backend[dev]"
      - name: Migrate and seed
        run: |
          (cd apps/backend && alembic upgrade head)
          python scripts/seed.py
      - name: Run CI eval subset
        run: python -m evals.run ci
      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: |
            evals/reports/
            docs/evals/retrieval-comparison.md

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jst
          POSTGRES_PASSWORD: jst
          POSTGRES_DB: jst
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jst -d jst"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://jst:jst@localhost:5432/jst
      ADMIN_TOKEN: ci-admin-token
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      # 30 browser tests back to back exceed the production default of 60/min,
      # and the run then fails on whichever test happens to cross the line —
      # latent flakiness that showed up as a "mobile-only" failure. The limiter
      # itself is covered by the backend security tests; here it only gets in
      # the way, so the E2E environment raises it rather than the product
      # weakening the control.
      RATE_LIMIT_PER_MINUTE: "100000"
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      API_BASE_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_ADMIN_TOKEN: ci-admin-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ./packages/shared_schemas -e ./packages/travel_mcp -e "./apps/backend[dev]"
      - name: Migrate and seed
        run: |
          (cd apps/backend && alembic upgrade head)
          python scripts/seed.py
      - name: Start API
        run: |
          uvicorn jst_api.main:app --app-dir apps/backend/src --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      - name: Build and start web
        working-directory: apps/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx next start -p 3000 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
      - name: Install browsers
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: apps/frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          tags: japan-second-trip-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: false
          tags: japan-second-trip-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building an image proves it compiles, not that it runs. The web
      # container once served every page correctly on its published port while
      # never becoming healthy (Next bound to $HOSTNAME, so loopback was
      # refused) — a build-only job cannot see that, and anything gating on
      # health would have hung. So bring the real stack up and require all four
      # services healthy.
      - name: Start the stack and require it healthy
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke the running stack
        run: |
          set -euo pipefail
          for url in \
            http://127.0.0.1:8000/health \
            http://127.0.0.1:8000/ready \
            http://127.0.0.1:3000/ \
            http://127.0.0.1:3000/where-next \
            http://127.0.0.1:3000/route-check; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "$code  $url"
            [ "$code" = "200" ] || { echo "expected 200"; exit 1; }
          done
          # The seed must have run inside the container, not just the migrations.
          docker compose exec -T db psql -U jst -d jst -tAc \
            "select count(*) from regions" | grep -qE '^[1-9]' || {
              echo "the API container did not seed the database"; exit 1; }

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Deployment gate. Everything above must be green.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [lint, frontend, backend, security, evals, e2e, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Push images and roll the service
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        run: ./scripts/deploy.sh
      - name: Deployment not configured
        if: vars.AWS_DEPLOY_ROLE_ARN == ''
        run: |
          echo "AWS_DEPLOY_ROLE_ARN is not set for this repository."
          echo "All gates passed; the deploy step is a no-op until AWS is wired up."
          echo "See docs/deployment.md and infra/terraform/."
