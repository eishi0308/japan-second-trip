; Repo-wide type-checking configuration.
;
; At the root, next to ruff.toml, so `mypy backend/src/jst_api packages/...`
; from the repository root picks it up — which is how CI and scripts/check.sh
; invoke it.

[mypy]
python_version = 3.12
plugins = pydantic.mypy
mypy_path = backend/src:packages/shared_schemas/src:packages/travel_mcp/src
namespace_packages = True
explicit_package_bases = True
ignore_missing_imports = True
warn_redundant_casts = True
warn_unused_ignores = False
; The codebase is typed but not exhaustively annotated at every internal
; boundary; raising this is a deliberate future step, not an oversight.
disallow_untyped_defs = False

; Optional live-provider and tracing dependencies. Each is imported lazily inside
; the adapter that needs it, and the application runs fully without any of them —
; that is the point of the provider abstraction (docs/adr/0008).
[mypy-anthropic.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-openai.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-langfuse.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-opentelemetry.*]
ignore_missing_imports = True
follow_imports = skip
