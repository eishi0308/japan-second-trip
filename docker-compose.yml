name: japan-second-trip

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jst
      POSTGRES_PASSWORD: jst
      POSTGRES_DB: jst
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jst -d jst"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://jst:jst@db:5432/jst
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: local
      LOG_JSON: "false"
      # Both spellings, as in .env.example. A browser that reaches the web
      # app on 127.0.0.1 sends that as its Origin, and listing only the
      # localhost form fails every client-side call with no server-side error.
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      # Production default, overridable for test runs that drive the UI hard.
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-60}"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      LLM_PROVIDER: ${LLM_PROVIDER:-demo}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    environment:
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
